<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1356 682" width="1356" height="682" role="img" aria-labelledby="t d">
<g id="still"/>
<title id="t">Code architecture of the public site</title>
<desc id="d">One Django project. scanner: parsers, scan · sources · versions, triage, news · headlines, http_client · store, history, middleware, ScanLog. The scanner asks six public sources and saves public data in a cache file. Everything writes to one database.</desc>
<style>
  text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  .b { font-weight: 800; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  #still:target ~ *, #still:target ~ * * { animation: none !important; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8A93A6"/></marker>
  <marker id="ah-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F5E8C"/></marker>
  <marker id="ah-sage" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5C7A6B"/></marker>
</defs>
