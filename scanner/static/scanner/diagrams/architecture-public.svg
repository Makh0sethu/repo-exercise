">fixed</text><rect x="72" y="260" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="72" y="260" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="88" y="287" font-size="13" fill="#16344D" class="mono b">news · headlines</text><text x="88" y="310" font-size="12.5" fill="#546E83">Feeds, CVE matching, the newsroom</text><rect x="348" y="260" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="348" y="260" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="364" y="287" font-size="13" fill="#16344D" class="mono b">http_client · store</text><text x="364" y="310" font-size="12.5" fill="#546E83">Outbound requests and the public</text><text x="364" y="327" font-size="12.5" fill="#546E83">cache</text><rect x="624" y="260" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="624" y="260" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="640" y="287" font-size="13" fill="#16344D" class="mono b">history</text><text x="640" y="310" font-size="12.5" fill="#546E83">Results kept in your session only</text><rect x="72" y="358" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="72" y="358" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="88" y="385" font-size="13" fill="#16344D" class="mono b">middleware</text><text x="88" y="408" font-size="12.5" fill="#546E83">Tracing, security headers, rate</text><text x="88" y="425" font-size="12.5" fill="#546E83">limits</text><rect x="348" y="358" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="348" y="358" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="364" y="385" font-size="13" fill="#16344D" class="mono b">ScanLog</text><text x="364" y="408" font-size="12.5" fill="#546E83">Scan log, deleted after 30 days</text><rect x="1059" y="111" width="270" height="160" rx="16" fill="#000" opacity=".10"/><rect x="1056" y="106" width="270" height="160" rx="16" fill="#FBF8F1"/><circle cx="1147.0" cy="134" r="17" fill="#C99754"/><text x="1147.0" y="138" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">OSV</text><circle cx="1191.0" cy="134" r="17" fill="#B1643E"/><text x="1191.0" y="138" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">KEV</text><circle cx="1235.0" cy="134" r="17" fill="#8EA38E"/><text x="1235.0" y="138" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">NVD</text><circle cx="1147.0" cy="174" r="17" fill="#16344D"/><text x="1147.0" y="178" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">CVE</text><circle cx="1191.0" cy="174" r="17" fill="#C99754"/><text x="1191.0" y="178" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">JS</text><circle cx="1235.0" cy="174" r="17" fill="#5C7A6B"/><text x="1235.0" y="178" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">RSS</text><text x="1191.0" y="222" font-size="16" fill="#16344D" text-anchor="middle" class="b">6 public sources</text><text x="1191.0" y="242" font-size="12.5" fill="#546E83" text-anchor="middle">OSV · KEV · NVD · CVE.org · RetireJS · news</text><path d="M912 186.0 H1048" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="947" y="157.0" width="69" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="981.0" y="174.5" font-size="11.5" fill="#546E83" text-anchor="middle" class="b">lookups</text><rect x="1059" y="301" width="270" height="120" rx="14" fill="#000" opacity=".10"/><path d="M1056 310 V402 A135.0 14 0 0 0 1326 402 V310 Z" fill="#5C7A6B"/><ellipse cx="1191.0" cy="310" rx="135.0" ry="14" fill="#5C7A6B"/><ellipse cx="1191.0" cy="310" rx="129.0" ry="9" fill="#fff" opacity=".18"/><text x="1191.0" y="348" font-size="17" fill="#F4F0E4" text-anchor="middle" class="b">Public cache</text><text x="1191.0" y="370" font-size="13" fill="#F4F0E4" text-anchor="middle">SQLite file · advisories, feeds</text><path d="M912 356 H1048" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="913" y="