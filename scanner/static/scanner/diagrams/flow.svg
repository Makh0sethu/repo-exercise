<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<g id="still"/>
<title id="t">How a scan travels</title>
<desc id="d">You send a dependency file through Cloudflare and nginx to Sentinel, which asks six public sources at once; the results come back to your browser only. Your file is never stored; results live in your browser session; a scan log is deleted after 30 days; a public cache keeps advisory records and news feeds.</desc>
<style>
  text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  .b { font-weight: 800; }

  .flowline { animation: flow 1.4s linear infinite; }
  .flowback { animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -32; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  #still:target ~ *, #still:target ~ * * { animation: none !important; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8A93A6"/></marker>
  <marker id="ah-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F5E8C"/></marker>
  <marker id="ah-sage" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5C7A6B"/></marker>
</defs>
<path class="flowback" d="M1080 64 V32 H110 V62" fill="none" stroke="#5C7A6B" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#ah-sage)"/><rect x="422" y="19" width="346" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="595" y="36.5" font-size="13" fill="#5C7A6B" text-anchor="middle" class="b">your results come back to your browser only</text><rect x="23" y="75" width="180" height="190" rx="16" fill="#000" opacity=".10"/><rect x="20" y="70" width="180" height="190" rx="16" fill="#FBF8F1"/><rect x="76.0" y="92" width="68" height="48" rx="7" fill="none" stroke="#16344D" stroke-width="4"/><path d="M76.0 105 H144.0" stroke="#16344D" stroke-width="4"/><circle cx="85.0" cy="98.5" r="2.5" fill="#B1643E"/><circle cx="93.0" cy="98.5" r="2.5" fill="#C99754"/><rect x="101.0" y="112" width="20" height="22" rx="3" fill="#C99754"/><text x="110.0" y="182" font-size="18" fill="#16344D" text-anchor="middle" class="b">You</text><text x="110.0" y="204" font-size="13" fill="#546E83" text-anchor="middle">Upload or paste a</text><text x="110.0" y="222" font-size="13" fill="#546E83" text-anchor="middle">dependency file</text><path class="flowline" d="M206 165.0 H237" stroke="#2F5E8C" stroke-width="3.5" stroke-dasharray="7 9" marker-end="url(#ah-navy)"/><rect x="248" y="75" width="180" height="190" rx="16" fill="#000" opacity=".10"/><rect x="245" y="70" width="180" height="190" rx="16" fill="#FBF8F1"/><g fill="#C99754"><circle cx="317.0" cy="122" r="16"/><circle cx="337.0" cy="112" r="20"/><circle cx="357.0" cy="124" r="14"/><rect x="301.0" y="122" width="70" height="16" rx="8"/></g><text x="335.0" y="182" font-size="18" fill="#16344D" text-anchor="middle" class="b">Cloudflare</text><text x="335.0" y="204" font-size="13" fill="#546E83" text-anchor="middle">Encrypts the connection,</text><text x="335.0" y="222" font-size="13" fill="#546E83" text-anchor="middle">absorbs attacks</text><path class="flowline" d="M431 165.0 H462" stroke="#2F5E8C" stroke-width="3.5" stroke-dasharray="7 9" marker-end="url(#ah-navy)"/><rect x="473" y="75" width="180" height="190" rx="16" fill="#000" opacity=".10"/><rect x="470" y="70" width="180" height="190" rx="16" fill="#FBF8F1"/><path d="M530.0 142 V114 A30 30 0 0 1 590.0 114 V142 Z" fill="#8EA38E"/><path d="M544.0 142 V120 A16 16 0 0 1 576.0 120 V142 Z" fill="#16344D"/><rect x="548.0" y="118" width="3" height="24" fill="#F4F0E4"/><rect x="557.0" y="118" width="3" height="24" fill="#F4F0E4"/><rect x="566.0" y="118" width="3" height="24" fill="#F4F0E4"/><text x="560.0" y="182" font-size="18" fill="#16344D" text-anchor="middle" class="b">nginx</text><text x="560.0" y="204" font-size="13" fill="#546E83" text-anchor="middle">Rate limits scans; only</text><text x="560.0" y="222" font-size="13" fill="#546E83" text-anchor="middle">public pages pass</text><path class="flowline" d="M656 165.0 H687" stroke="#2F5E8C" stroke-width="3.5" stroke-dasharray="7 9" marker-end="url(#ah-navy)"/><rect x="698" y="75" width="240" height="190" rx="16" fill="#000" opacity=".10"/><rect x="695" y="70" width="240" height="190" rx="16" fill="#FBF8F1" stroke="#2F5E8C" stroke-width="2.5"/><path d="M815.0 90 L843.0 101 V118 C843.0 134 830.0 142 815.0 147 C800.0 142 787.0 134 787.0 118 V101 Z" fill="#16344D"/><path d="M804.0 118 l8 8 l16 -17" fill="none" stroke="#C99754" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="815.0" y="182" font-size="18" fill="#16344D" text-anchor="middle" class="b">Sentinel</text><text x="815.0" y="204" font-size="13" fill="#546E83" text-anchor="middle">Reads the file in memory, asks</text><text x="815.0" y="222" font-size="13" fill="#546E83" text-anchor="middle">the sources, ranks findings</text><path class="flowline" d="M941 165.0 H972" stroke="#2F5E8C" stroke-width="3.5" stroke-dasharray="7 9" marker-end="url(#ah-navy)"/><rect x="983" y="75" width="200" height="190" rx="16" fill="#000" opacity=".10"/><rect x="980" y="70" width="200" height="190" rx="16" fill="#FBF8F1"/><circle cx="1032.0" cy="98" r="19" fill="#C99754"/><text x="1032.0" y="102" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">OSV</text><circle cx="1080.0" cy="98" r="19" fill="#B1643E"/><text x="1080.0" y="102" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">KEV</text><circle cx="1128.0" cy="98" r="19" fill="#8EA38E"/><text x="1128.0" y="102" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">NVD</text><circle cx="1032.0" cy="142" r="19" fill="#16344D"/><text x="1032.0" y="146" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">CVE</text><circle cx="1080.0" cy="142" r="19" fill="#C99754"/><text x="1080.0" y="146" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">JS</text><circle cx="1128.0" cy="142" r="19" fill="#5C7A6B"/><text x="1128.0" y="146" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">RSS</text><text x="1080.0" y="182" font-size="18" fill="#16344D" text-anchor="middle" class="b">6 public sources</text><text x="1080.0" y="204" font-size="13" fill="#546E83" text-anchor="middle">Asked all at once</text><path d="M815 260 V318 M165 318 H1035" stroke="#8A93A6" stroke-width="2.5" fill="none"/><rect x="762" y="305" width="106" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="815" y="322.5" font-size="12" fill="#16344D" text-anchor="middle" class="b">what is kept</text><path d="M165 318 V354" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="43" y="365" width="250" height="130" rx="16" fill="#000" opacity=".10"/><rect x="40" y="360" width="250" height="130" rx="16" fill="#FBF8F1" stroke="#B1643E" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M147 378 H173 L185 390 V422 H147 Z" fill="#F4F0E4" stroke="#546E83" stroke-width="2"/><path d="M141 376 L191 426 M191 376 L141 426" stroke="#B1643E" stroke-width="5" stroke-linecap="round"/><text x="165" y="452" font-size="16" fill="#16344D" text-anchor="middle" class="b">Your file</text><text x="165" y="473" font-size="13" fill="#B1643E" text-anchor="middle" class="b">Never stored: read in memory</text><path d="M455 318 V354" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="333" y="365" width="250" height="130" rx="16" fill="#000" opacity=".10"/><rect x="330" y="360" width="250" height="130" rx="16" fill="#FBF8F1"/><rect x="425" y="378" width="60" height="44" rx="6" fill="none" stroke="#16344D" stroke-width="3.5"/><path d="M425 390 H485" stroke="#16344D" stroke-width="3.5"/><path d="M441 406 l8 8 l18 -18" fill="none" stroke="#5C7A6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="455" y="452" font-size="16" fill="#16344D" text-anchor="middle" class="b">Your results</text><text x="455" y="473" font-size="13" fill="#546E83" text-anchor="middle">In your browser session only</text><path d="M745 318 V354" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="623" y="365" width="250" height="130" rx="14" fill="#000" opacity=".10"/><path d="M620 374 V476 A125.0 14 0 0 0 870 476 V374 Z" fill="#16344D"/><ellipse cx="745.0" cy="374" rx="125.0" ry="14" fill="#16344D"/><ellipse cx="745.0" cy="374" rx="119.0" ry="9" fill="#fff" opacity=".18"/><text x="745.0" y="412" font-size="17" fill="#F4F0E4" text-anchor="middle" class="b">Scan log</text><text x="745.0" y="434" font-size="13" fill="#F4F0E4" text-anchor="middle">Time, IP, package list · deleted</text><text x="745.0" y="452" font-size="13" fill="#F4F0E4" text-anchor="middle">after 30 days</text><path d="M1035 318 V354" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="913" y="365" width="250" height="130" rx="14" fill="#000" opacity=".10"/><path d="M910 374 V476 A125.0 14 0 0 0 1160 476 V374 Z" fill="#5C7A6B"/><ellipse cx="1035.0" cy="374" rx="125.0" ry="14" fill="#5C7A6B"/><ellipse cx="1035.0" cy="374" rx="119.0" ry="9" fill="#fff" opacity=".18"/><text x="1035.0" y="412" font-size="17" fill="#F4F0E4" text-anchor="middle" class="b">Public cache</text><text x="1035.0" y="434" font-size="13" fill="#F4F0E4" text-anchor="middle">Advisory records and news feeds</text>
</svg>
