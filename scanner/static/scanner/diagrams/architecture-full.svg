<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1356 1368" width="1356" height="1368" role="img" aria-labelledby="t d">
<g id="still"/>
<title id="t">Code architecture</title>
<desc id="d">One Django project. scanner: parsers, scan · sources · versions, triage, news · headlines, http_client · store, history, middleware, ScanLog. pipeline: gitsafe, runner · jobs · adapters, bugchecks · osvlocal, access, Target · Run · Step · Finding. accounts: github, roles · identity, middleware. audit: log, AuditEvent · EvidenceArtifact, verify_audit. The scanner asks six public sources and saves public data in a cache file; the pipeline runs security tools and clones from GitHub, accounts signs in with GitHub, and audit files evidence by SHA-256. Everything writes to one database.</desc>
<style>
  text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  .b { font-weight: 800; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  #still:target ~ *, #still:target ~ * * { animation: none !important; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8A93A6"/></marker>
  <marker id="ah-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F5E8C"/></marker>
  <marker id="ah-sage" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5C7A6B"/></marker>
</defs>
<rect x="28" y="40" width="902" height="1138" rx="26" fill="none" stroke="#8A93A6" stroke-width="2.5" stroke-dasharray="10 8"/><rect x="65" y="27" width="226" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="178" y="44.5" font-size="13" fill="#16344D" text-anchor="middle" class="b">config · one Django project</text><rect x="55" y="105" width="854" height="370" rx="16" fill="#000" opacity=".10"/><rect x="52" y="100" width="854" height="370" rx="16" fill="#FBF8F1"/><rect x="52" y="100" width="854" height="10" rx="5" fill="#2F5E8C"/><text x="72" y="140" font-size="20" fill="#16344D" class="b">scanner</text><text x="159.5" y="140" font-size="13" fill="#546E83" class="mono">/</text><text x="181.5" y="140" font-size="13" fill="#546E83">Dependency scanner, news and the public site</text><rect x="72" y="162" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="72" y="162" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="88" y="189" font-size="13" fill="#16344D" class="mono b">parsers</text><text x="88" y="212" font-size="12.5" fill="#546E83">Reads dependency files and</text><text x="88" y="229" font-size="12.5" fill="#546E83">lockfiles</text><rect x="348" y="162" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="348" y="162" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="364" y="189" font-size="13" fill="#16344D" class="mono b">scan · sources · versions</text><text x="364" y="212" font-size="12.5" fill="#546E83">Asks six sources at once, merges</text><text x="364" y="229" font-size="12.5" fill="#546E83">duplicates</text><rect x="624" y="162" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="624" y="162" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="640" y="189" font-size="13" fill="#16344D" class="mono b">triage</text><text x="640" y="212" font-size="12.5" fill="#546E83">Confirmed, possible or already</text><text x="640" y="229" font-size="12.5" fill="#546E83">fixed</text><rect x="72" y="260" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="72" y="260" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="88" y="287" font-size="13" fill="#16344D" class="mono b">news · headlines</text><text x="88" y="310" font-size="12.5" fill="#546E83">Feeds, CVE matching, the newsroom</text><rect x="348" y="260" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="348" y="260" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="364" y="287" font-size="13" fill="#16344D" class="mono b">http_client · store</text><text x="364" y="310" font-size="12.5" fill="#546E83">Outbound requests and the public</text><text x="364" y="327" font-size="12.5" fill="#546E83">cache</text><rect x="624" y="260" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="624" y="260" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="640" y="287" font-size="13" fill="#16344D" class="mono b">history</text><text x="640" y="310" font-size="12.5" fill="#546E83">Results kept in your session only</text><rect x="72" y="358" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="72" y="358" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="88" y="385" font-size="13" fill="#16344D" class="mono b">middleware</text><text x="88" y="408" font-size="12.5" fill="#546E83">Tracing, security headers, rate</text><text x="88" y="425" font-size="12.5" fill="#546E83">limits</text><rect x="348" y="358" width="262" height="84" rx="12" fill="#2F5E8C" opacity=".13"/><rect x="348" y="358" width="5" height="84" rx="2.5" fill="#2F5E8C"/><text x="364" y="385" font-size="13" fill="#16344D" class="mono b">ScanLog</text><text x="364" y="408" font-size="12.5" fill="#546E83">Scan log, deleted after 30 days</text><rect x="55" y="497" width="854" height="272" rx="16" fill="#000" opacity=".10"/><rect x="52" y="492" width="854" height="272" rx="16" fill="#FBF8F1"/><rect x="52" y="492" width="854" height="10" rx="5" fill="#B1643E"/><text x="72" y="532" font-size="20" fill="#16344D" class="b">pipeline</text><text x="172.0" y="532" font-size="13" fill="#546E83" class="mono">/server/</text><text x="250.0" y="532" font-size="13" fill="#546E83">Security runs on registered Git targets</text><rect x="72" y="554" width="262" height="84" rx="12" fill="#B1643E" opacity=".13"/><rect x="72" y="554" width="5" height="84" rx="2.5" fill="#B1643E"/><text x="88" y="581" font-size="13" fill="#16344D" class="mono b">gitsafe</text><text x="88" y="604" font-size="12.5" fill="#546E83">Checks repository URLs before</text><text x="88" y="621" font-size="12.5" fill="#546E83">cloning</text><rect x="348" y="554" width="262" height="84" rx="12" fill="#B1643E" opacity=".13"/><rect x="348" y="554" width="5" height="84" rx="2.5" fill="#B1643E"/><text x="364" y="581" font-size="13" fill="#16344D" class="mono b">runner · jobs · adapters</text><text x="364" y="604" font-size="12.5" fill="#546E83">Runs each tool, keeps its output</text><rect x="624" y="554" width="262" height="84" rx="12" fill="#B1643E" opacity=".13"/><rect x="624" y="554" width="5" height="84" rx="2.5" fill="#B1643E"/><text x="640" y="581" font-size="13" fill="#16344D" class="mono b">bugchecks · osvlocal</text><text x="640" y="604" font-size="12.5" fill="#546E83">Built-in checks and offline OSV</text><text x="640" y="621" font-size="12.5" fill="#546E83">data</text><rect x="72" y="652" width="262" height="84" rx="12" fill="#B1643E" opacity=".13"/><rect x="72" y="652" width="5" height="84" rx="2.5" fill="#B1643E"/><text x="88" y="679" font-size="13" fill="#16344D" class="mono b">access</text><text x="88" y="702" font-size="12.5" fill="#546E83">Permission checks on every page</text><rect x="348" y="652" width="262" height="84" rx="12" fill="#B1643E" opacity=".13"/><rect x="348" y="652" width="5" height="84" rx="2.5" fill="#B1643E"/><text x="364" y="679" font-size="11.5" fill="#16344D" class="mono b">Target · Run · Step · Finding</text><text x="364" y="702" font-size="12.5" fill="#546E83">What ran, and what it found</text><rect x="55" y="791" width="854" height="174" rx="16" fill="#000" opacity=".10"/><rect x="52" y="786" width="854" height="174" rx="16" fill="#FBF8F1"/><rect x="52" y="786" width="854" height="10" rx="5" fill="#5C7A6B"/><text x="72" y="826" font-size="20" fill="#16344D" class="b">accounts</text><text x="172.0" y="826" font-size="13" fill="#546E83" class="mono">/auth/</text><text x="234.0" y="826" font-size="13" fill="#546E83">GitHub sign-in and roles</text><rect x="72" y="848" width="262" height="84" rx="12" fill="#5C7A6B" opacity=".13"/><rect x="72" y="848" width="5" height="84" rx="2.5" fill="#5C7A6B"/><text x="88" y="875" font-size="13" fill="#16344D" class="mono b">github</text><text x="88" y="898" font-size="12.5" fill="#546E83">The OAuth sign-in flow</text><rect x="348" y="848" width="262" height="84" rx="12" fill="#5C7A6B" opacity=".13"/><rect x="348" y="848" width="5" height="84" rx="2.5" fill="#5C7A6B"/><text x="364" y="875" font-size="13" fill="#16344D" class="mono b">roles · identity</text><text x="364" y="898" font-size="12.5" fill="#546E83">Only listed logins get a role</text><rect x="624" y="848" width="262" height="84" rx="12" fill="#5C7A6B" opacity=".13"/><rect x="624" y="848" width="5" height="84" rx="2.5" fill="#5C7A6B"/><text x="640" y="875" font-size="13" fill="#16344D" class="mono b">middleware</text><text x="640" y="898" font-size="12.5" fill="#546E83">Removed users are signed out at</text><text x="640" y="915" font-size="12.5" fill="#546E83">once</text><rect x="55" y="987" width="854" height="174" rx="16" fill="#000" opacity=".10"/><rect x="52" y="982" width="854" height="174" rx="16" fill="#FBF8F1"/><rect x="52" y="982" width="854" height="10" rx="5" fill="#C99754"/><text x="72" y="1022" font-size="20" fill="#16344D" class="b">audit</text><text x="134.5" y="1022" font-size="13" fill="#546E83">Tamper-evident record of what happened</text><rect x="72" y="1044" width="262" height="84" rx="12" fill="#C99754" opacity=".13"/><rect x="72" y="1044" width="5" height="84" rx="2.5" fill="#C99754"/><text x="88" y="1071" font-size="13" fill="#16344D" class="mono b">log</text><text x="88" y="1094" font-size="12.5" fill="#546E83">Hash-chained events, evidence by</text><text x="88" y="1111" font-size="12.5" fill="#546E83">SHA-256</text><rect x="348" y="1044" width="262" height="84" rx="12" fill="#C99754" opacity=".13"/><rect x="348" y="1044" width="5" height="84" rx="2.5" fill="#C99754"/><text x="364" y="1071" font-size="11.5" fill="#16344D" class="mono b">AuditEvent · EvidenceArtifact</text><text x="364" y="1094" font-size="12.5" fill="#546E83">The record and its evidence</text><rect x="624" y="1044" width="262" height="84" rx="12" fill="#C99754" opacity=".13"/><rect x="624" y="1044" width="5" height="84" rx="2.5" fill="#C99754"/><text x="640" y="1071" font-size="13" fill="#16344D" class="mono b">verify_audit</text><text x="640" y="1094" font-size="12.5" fill="#546E83">Re-checks the whole chain</text><rect x="1059" y="111" width="270" height="160" rx="16" fill="#000" opacity=".10"/><rect x="1056" y="106" width="270" height="160" rx="16" fill="#FBF8F1"/><circle cx="1147.0" cy="134" r="17" fill="#C99754"/><text x="1147.0" y="138" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">OSV</text><circle cx="1191.0" cy="134" r="17" fill="#B1643E"/><text x="1191.0" y="138" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">KEV</text><circle cx="1235.0" cy="134" r="17" fill="#8EA38E"/><text x="1235.0" y="138" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">NVD</text><circle cx="1147.0" cy="174" r="17" fill="#16344D"/><text x="1147.0" y="178" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">CVE</text><circle cx="1191.0" cy="174" r="17" fill="#C99754"/><text x="1191.0" y="178" font-size="10.5" class="b" fill="#16344D" text-anchor="middle">JS</text><circle cx="1235.0" cy="174" r="17" fill="#5C7A6B"/><text x="1235.0" y="178" font-size="10.5" class="b" fill="#F4F0E4" text-anchor="middle">RSS</text><text x="1191.0" y="222" font-size="16" fill="#16344D" text-anchor="middle" class="b">6 public sources</text><text x="1191.0" y="242" font-size="12.5" fill="#546E83" text-anchor="middle">OSV · KEV · NVD · CVE.org · RetireJS · news</text><path d="M912 186.0 H1048" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="947" y="157.0" width="69" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="981.0" y="174.5" font-size="11.5" fill="#546E83" text-anchor="middle" class="b">lookups</text><rect x="1059" y="301" width="270" height="120" rx="14" fill="#000" opacity=".10"/><path d="M1056 310 V402 A135.0 14 0 0 0 1326 402 V310 Z" fill="#5C7A6B"/><ellipse cx="1191.0" cy="310" rx="135.0" ry="14" fill="#5C7A6B"/><ellipse cx="1191.0" cy="310" rx="129.0" ry="9" fill="#fff" opacity=".18"/><text x="1191.0" y="348" font-size="17" fill="#F4F0E4" text-anchor="middle" class="b">Public cache</text><text x="1191.0" y="370" font-size="13" fill="#F4F0E4" text-anchor="middle">SQLite file · advisories, feeds</text><path d="M912 356 H1048" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="913" y="327" width="135" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="981.0" y="344.5" font-size="11.5" fill="#546E83" text-anchor="middle" class="b">saves public data</text><rect x="1059" y="505" width="270" height="118" rx="16" fill="#000" opacity=".10"/><rect x="1056" y="500" width="270" height="118" rx="16" fill="#FBF8F1"/><circle cx="1185.0" cy="530" r="18" fill="none" stroke="#16344D" stroke-width="5"/><path d="M1198.0 543 l14 14" stroke="#16344D" stroke-width="7" stroke-linecap="round"/><circle cx="1185.0" cy="530" r="6" fill="#B1643E"/><text x="1191.0" y="574" font-size="16" fill="#16344D" text-anchor="middle" class="b">Security tools</text><text x="1191.0" y="594" font-size="12.5" fill="#546E83" text-anchor="mid