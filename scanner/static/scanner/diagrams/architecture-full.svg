>Evidence store</text><text x="1191.0" y="1064" font-size="13" fill="#16344D" text-anchor="middle">Tool output, filed by SHA-256</text><path d="M912 1052 H1048" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="943" y="1023" width="75" height="26" rx="13" fill="#FBF8F1" stroke="#8A93A6" stroke-width="1.5"/><text x="981.0" y="1040.5" font-size="11.5" fill="#546E83" text-anchor="middle" class="b">evidence</text><path d="M479.0 1178 V1212" stroke="#8A93A6" stroke-width="2.5" marker-end="url(#ah)"/><rect x="222.0" y="1223" width="520" height="120" rx="14" fill="#000" opacity=".10"/><path d="M219.0 1232 V1324 A260.0 14 0 0 0 739.0 1324 V1232 Z" fill="#16344D"/><ellipse cx="479.0" cy="1232" rx="260.0" ry="14" fill="#16344D"/><ellipse cx="479.0" cy="1232" rx="254.0" ry="9" fill="#fff" opacity=".18"/><text x="479.0" y="1270" font-size="17" fill="#F4F0E4" text-anchor="middle" class="b">Database</text><text x="479.0" y="1292" font-size="13" fill="#F4F0E4" text-anchor="middle">Scan logs, runs, audit events, sessions</text>
