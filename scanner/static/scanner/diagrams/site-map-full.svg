<g id="still"/>
<title id="t">Site map</title>
<desc id="d">Home links to Scan (/scan/), Results (/results/), About (/about/), Health check (/health/), Security runs (/server/), Sign-in (/auth/), Admin (private address), Static files (/static/). Under Scan: Detected packages (/parse/). Under Results: Scan result (/results/&lt;id&gt;/). Under Security runs: Add target (/server/targets/add/), Start run (/server/start/), Run detail (/server/runs/&lt;id&gt;/), Run status (/server/runs/&lt;id&gt;/status/), Audit trail (/server/audit/). Under Sign-in: Sign in (/auth/github/login/), Callback (/auth/github/callback/), Sign out (/auth/logout/).</desc>
<style>
  text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  .b { font-weight: 800; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  #still:target ~ *, #still:target ~ * * { animation: none !important; }
</style>
