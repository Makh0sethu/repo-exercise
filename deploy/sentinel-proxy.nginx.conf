# /etc/nginx/snippets/sentinel-proxy.conf, included by the sentinel.uhambo.co.zw locations.
proxy_pass http://127.0.0.1:8101;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: the app trusts this value
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-ID "";
proxy_read_timeout 45s;                          # a scan waits up to 25 s for the sources
proxy_connect_timeout 5s;
