# /etc/nginx/snippets/sentinel-path.conf, included in the uhambo.co.zw 443 server block (before
# "location / {") by install.sh when SENTINEL_URL_PREFIX=/sentinel. Temporary home until
# sentinel.uhambo.co.zw has DNS; remove the include line when moving to the subdomain.
#
# ^~ stops the main site's "\.(js|css|...)$" regex location from grabbing Sentinel's static files.
# Any add_header here drops the server block's headers for these paths; Django sends its own full
# set (CSP, HSTS, X-Frame-Options DENY, nosniff, Referrer-Policy, Permissions-Policy).

location = /sentinel { return 301 /sentinel/; }

location ^~ /sentinel/ {
    client_max_body_size 2m;                         # uploads are capped at 1 MB by the app
    add_header X-Robots-Tag "noindex, nofollow" always;   # test site: keep it out of search results
    limit_req zone=sentinel_web burst=40 nodelay;
    limit_req_status 429;

    # Admin parts are hidden on this site. Django doesn't route them either; this is a second lock.
    location ~ ^/sentinel/(server|auth|admin)(/|$) { return 404; }

    location ~ ^/sentinel/(scan|parse)/$ {
        limit_req zone=sentinel_scan burst=5 nodelay;
        limit_req zone=sentinel_web burst=40 nodelay;
        limit_req_status 429;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^/sentinel(/.*)$ $1 break;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }

    rewrite ^/sentinel(/.*)$ $1 break;
    include /etc/nginx/snippets/sentinel-proxy.conf;
}
