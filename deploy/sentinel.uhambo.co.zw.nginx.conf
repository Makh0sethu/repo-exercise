# sentinel.uhambo.co.zw: public-only Sentinel test site (Tier 2 app, port 8101).
# Installed by deploy/install.sh to /etc/nginx/sites-available/sentinel.uhambo.co.zw.
# Needs the shared Cloudflare real-IP config (/etc/nginx/conf.d/cloudflare-realip.conf, from the
# Sprint 4 backend install) so $remote_addr is the visitor, not Cloudflare.
# Security headers (CSP, HSTS, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy) come
# from Django on every response, so they are not repeated here (that would send them twice).

# Rate-limit zones live in /etc/nginx/conf.d/sentinel-zones.conf (deploy/sentinel-zones.nginx.conf).

server {
    listen 80;
    listen [::]:80;
    server_name sentinel.uhambo.co.zw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;                        # nginx 1.24 (Ubuntu 24.04): "http2 on;" needs 1.25.1+
    listen [::]:443 ssl http2;
    server_name sentinel.uhambo.co.zw;

    # certbot certonly --nginx -d sentinel.uhambo.co.zw   (NOT bare --nginx, see Sprint 5)
    ssl_certificate     /etc/letsencrypt/live/sentinel.uhambo.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentinel.uhambo.co.zw/privkey.pem;

    client_max_body_size 2m;                     # uploads are capped at 1 MB by the app

    # Admin parts are hidden on this site. Django doesn't route them either; this is a second lock.
    location ~ ^/(server|auth|admin)(/|$) { return 404; }

    location ~ ^/(scan|parse)/$ {
        limit_req zone=sentinel_scan burst=5 nodelay;
        limit_req zone=sentinel_web burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }

    location / {
        limit_req zone=sentinel_web burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }
}
