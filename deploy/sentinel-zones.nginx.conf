# /etc/nginx/conf.d/sentinel-zones.conf (http context). Rate-limit zones used by both the
# path setup (uhambo.co.zw/sentinel/) and the subdomain setup (sentinel.uhambo.co.zw).
# $binary_remote_addr is the visitor thanks to /etc/nginx/conf.d/cloudflare-realip.conf.

# Only POSTs to /scan/ and /parse/ count against the tight zone; an empty key is never limited.
map $request_method $sentinel_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sentinel_post_key zone=sentinel_scan:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=sentinel_web:10m rate=120r/m;
